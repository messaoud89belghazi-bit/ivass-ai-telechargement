<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiement Ivass AI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<style>
:root { color-scheme: dark; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#08090b; color:#e7e9ee; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:520px; margin:24px 16px; padding:28px 24px; background:#171b24; border:1px solid #2a3040; border-radius:18px; text-align:center; }
.ico { font-size:52px; line-height:1; margin-bottom:10px; }
h1 { font-size:24px; margin:0 0 10px; line-height:1.3; }
p { color:#b8bfcc; margin:10px 0; }
a { color:#b79cff; }
.btn { display:inline-block; margin-top:14px; padding:11px 20px; border-radius:12px; background:#e7e9ee; color:#08090b; font-weight:600; text-decoration:none; }
small { display:block; margin-top:18px; color:#7d8596; }
</style></head>
<body><main id="m">
<div class="ico">⭐</div>
<h1>Paiement Ivass AI</h1>
<p>Vous pouvez fermer cette page et revenir dans Ivass AI.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), m = document.getElementById('m');
  if (q.get('ok')) m.innerHTML = '<div class="ico">🎉</div><h1>Merci, votre paiement est validé</h1>' +
    '<p>Revenez dans <b>Ivass AI</b> : votre offre s’active toute seule en moins d’une minute (⭐ Offres).</p>' +
    '<p>Sur un autre appareil, entrez votre <b>code licence</b> (IVL-…) affiché dans ⭐ Offres.</p>' +
    '<p>Vous pouvez fermer cette page.</p><small>Paiement traité par PayPal. Résiliable à tout moment depuis ⭐ Offres ou sur paypal.com. <a href="conditions/#cgv">Conditions de vente</a></small>';
  else if (q.get('annule')) m.innerHTML = '<div class="ico">↩️</div><h1>Paiement annulé</h1>' +
    '<p>Aucun montant n’a été prélevé. Ivass AI reste utilisable avec votre offre actuelle.</p>' +
    '<p>Vous pouvez fermer cette page et revenir dans Ivass AI.</p><a class="btn" href="./">Retour à Ivass AI</a>';
})();
</script></body></html>
